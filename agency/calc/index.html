    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"uk\"><head>\n<meta charset=\"utf-8\">\n<title>Калькулятор прибутку агенції<\u002Ftitle>\n<script src=\"97fdf6a1-1c3a-49cd-88fe-8bccce37f974\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"1280\"><meta name=\"hz:canvas-height\" content=\"2300\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<style>/* latin-ext */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1b6eaa5d-7eb4-439a-89a6-ae10a49331fd\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"3f86a495-fffa-4b0b-9fa0-b6b94efb0808\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f7764c05-e2db-4e6e-a603-7ac110a6d8e6\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6fac44f8-b236-45cf-b8e6-39fd7463303f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#FFFFFF}\na{color:#1E1640}a:hover{color:#5A3FD0}\ninput:focus,select:focus,button:focus-visible{outline:3px solid #FFD426;outline-offset:2px}\ninput::placeholder{color:#8A8399}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width: 100%; background: #FFFFFF; color: #1E1640; font-family: 'Courier New', 'Courier Prime', monospace; box-sizing: border-box; padding: 56px 20px 64px\" data-canvas-width=\"1280\" data-canvas-height=\"2300\" data-document-role=\"page\" data-label=\"Лендинг калькулятора\">\n<div style=\"max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px\">\n\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center\">\n<span style=\"background: #FFD426; color: #1E1640; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; padding: 8px 18px; border-radius: 999px\">КАЛЬКУЛЯТОР<\u002Fspan>\n<h1 style=\"margin: 0; font-size: 44px; line-height: 1.15; font-weight: 700; max-width: 820px\">Дохід рекрутингової агенції<\u002Fh1>\n<p style=\"margin: 0; font-size: 19px; line-height: 1.5; max-width: 680px\">Додай вакансії, команду і витрати — прибуток порахується сам<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n\n<div style=\"background: #7B5CE8; color: #FFFFFF; border-radius: 28px; padding: 32px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px\">\n<h2 style=\"margin: 0; font-size: 24px; font-weight: 700\">1. Вакансії, закриті за місяць<\u002Fh2>\n<div style=\"display: flex; gap: 10px; font-size: 14px; color: #F1ECFF\">\n<span style=\"flex: 1 1 180px\">Вакансія<\u002Fspan>\n<span style=\"flex: 0 1 140px\">Оплата клієнта, грн<\u002Fspan>\n<span style=\"flex: 0 1 170px\">Хто закрив<\u002Fspan>\n<span style=\"flex: 0 0 44px\"><\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{vacancies}}\" as=\"item\" hint-placeholder-count=\"3\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n<input type=\"text\" aria-label=\"Назва вакансії\" placeholder=\"Вакансія {{item.num}}\" value=\"{{item.name}}\" sc-camel-on-change=\"{{item.onName}}\" style=\"flex: 1 1 180px; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 14px; background: #FFFFFF; color: #1E1640; font-family: inherit; font-size: 18px\">\n<input type=\"number\" min=\"0\" step=\"1000\" inputmode=\"numeric\" aria-label=\"Оплата клієнта, грн\" placeholder=\"0\" value=\"{{item.fee}}\" sc-camel-on-change=\"{{item.onFee}}\" style=\"flex: 0 1 140px; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 14px; background: #FFFFFF; color: #1E1640; font-family: inherit; font-size: 20px; font-weight: 700\">\n<sc-raw-select aria-label=\"Хто закрив вакансію\" value=\"{{item.who}}\" sc-camel-on-change=\"{{item.onWho}}\" style=\"flex: 0 1 170px; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 10px; border: none; border-radius: 14px; background: #FFFFFF; color: #1E1640; font-family: inherit; font-size: 17px; cursor: pointer\">\n<sc-for list=\"{{whoOptions}}\" as=\"opt\" hint-placeholder-count=\"2\">\n<option value=\"{{opt.value}}\">{{opt.label}}<\u002Foption>\n<\u002Fsc-for>\n<\u002Fsc-raw-select>\n<button type=\"button\" aria-label=\"Видалити вакансію\" sc-camel-on-click=\"{{item.onRemove}}\" style=\"flex: 0 0 44px; width: 44px; height: 44px; padding: 0; border: none; border-radius: 12px; background: #6448CF; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<button type=\"button\" sc-camel-on-click=\"{{addVacancy}}\" style=\"align-self: flex-start; min-height: 48px; padding: 0 22px; border: none; border-radius: 999px; background: #FFD426; color: #1E1640; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer\">+ Додати вакансію<\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"background: #FDECD3; color: #1E1640; border-radius: 28px; padding: 32px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px\">\n<h2 style=\"margin: 0; font-size: 24px; font-weight: 700\">2. Твоя команда<\u002Fh2>\n<div style=\"display: flex; gap: 10px; font-size: 14px; color: #5B5470\">\n<span style=\"flex: 1 1 180px\">Рекрутер<\u002Fspan>\n<span style=\"flex: 0 1 140px\">Ставка на місяць, грн<\u002Fspan>\n<span style=\"flex: 0 1 170px\">Бонус, % від оплати<\u002Fspan>\n<span style=\"flex: 0 0 44px\"><\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{recruiters}}\" as=\"item\" hint-placeholder-count=\"1\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n<input type=\"text\" aria-label=\"Ім'я рекрутера\" placeholder=\"Рекрутер {{item.num}}\" value=\"{{item.name}}\" sc-camel-on-change=\"{{item.onName}}\" style=\"flex: 1 1 180px; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 14px; background: #FFFFFF; color: #1E1640; font-family: inherit; font-size: 18px\">\n<input type=\"number\" min=\"0\" step=\"1000\" inputmode=\"numeric\" aria-label=\"Ставка на місяць, грн\" placeholder=\"0\" value=\"{{item.salary}}\" sc-camel-on-change=\"{{item.onSalary}}\" style=\"flex: 0 1 140px; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 14px; background: #FFFFFF; color: #1E1640; font-family: inherit; font-size: 20px; font-weight: 700\">\n<input type=\"number\" min=\"0\" max=\"100\" step=\"1\" inputmode=\"numeric\" aria-label=\"Бонус, % від оплати клієнта\" placeholder=\"0\" value=\"{{item.bonus}}\" sc-camel-on-change=\"{{item.onBonus}}\" style=\"flex: 0 1 170px; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 14px; background: #FFFFFF; color: #1E1640; font-family: inherit; font-size: 20px; font-weight: 700\">\n<button type=\"button\" aria-label=\"Видалити рекрутера\" sc-camel-on-click=\"{{item.onRemove}}\" style=\"flex: 0 0 44px; width: 44px; height: 44px; padding: 0; border: none; border-radius: 12px; background: #F3D9B5; color: #1E1640; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<button type=\"button\" sc-camel-on-click=\"{{addRecruiter}}\" style=\"align-self: flex-start; min-height: 48px; padding: 0 22px; border: none; border-radius: 999px; background: #7B5CE8; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer\">+ Додати рекрутера<\u002Fbutton>\n<span style=\"font-size: 14px; color: #5B5470\">Бонус рахується тільки з вакансій, які закрив цей рекрутер<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"background: #7B5CE8; color: #FFFFFF; border-radius: 28px; padding: 32px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px\">\n<h2 style=\"margin: 0; font-size: 24px; font-weight: 700\">3. Податки<\u002Fh2>\n<span style=\"font-size: 14px; color: #F1ECFF\">Вже заповнено для ФОП 3 групи. Якщо в тебе інша система — зміни цифри<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n<label for=\"f-ep\" style=\"flex: 1 1 220px; font-size: 17px; font-weight: 700\">Єдиний податок<\u002Flabel>\n<input id=\"f-ep\" type=\"number\" min=\"0\" max=\"100\" step=\"0.5\" inputmode=\"decimal\" value=\"{{ep}}\" sc-camel-on-change=\"{{onEp}}\" style=\"flex: 0 1 140px; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 14px; background: #FFFFFF; color: #1E1640; font-family: inherit; font-size: 20px; font-weight: 700\">\n<span style=\"flex: 0 0 130px; font-size: 15px\">% від доходу<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n<label for=\"f-vz\" style=\"flex: 1 1 220px; font-size: 17px; font-weight: 700\">Військовий збір<\u002Flabel>\n<input id=\"f-vz\" type=\"number\" min=\"0\" max=\"100\" step=\"0.5\" inputmode=\"decimal\" value=\"{{vz}}\" sc-camel-on-change=\"{{onVz}}\" style=\"flex: 0 1 140px; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 14px; background: #FFFFFF; color: #1E1640; font-family: inherit; font-size: 20px; font-weight: 700\">\n<span style=\"flex: 0 0 130px; font-size: 15px\">% від доходу<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n<label for=\"f-esv\" style=\"flex: 1 1 220px; font-size: 17px; font-weight: 700\">ЄСВ<\u002Flabel>\n<input id=\"f-esv\" type=\"number\" min=\"0\" step=\"100\" inputmode=\"numeric\" value=\"{{esv}}\" sc-camel-on-change=\"{{onEsv}}\" style=\"flex: 0 1 140px; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 14px; background: #FFFFFF; color: #1E1640; font-family: inherit; font-size: 20px; font-weight: 700\">\n<span style=\"flex: 0 0 130px; font-size: 15px\">грн на місяць<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #FDECD3; color: #1E1640; border-radius: 28px; padding: 32px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px\">\n<h2 style=\"margin: 0; font-size: 24px; font-weight: 700\">4. Інші витрати за місяць<\u002Fh2>\n<div style=\"display: flex; gap: 10px; font-size: 14px; color: #5B5470\">\n<span style=\"flex: 1 1 180px\">Витрата<\u002Fspan>\n<span style=\"flex: 0 1 140px\">Сума, грн<\u002Fspan>\n<span style=\"flex: 0 0 44px\"><\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{expenses}}\" as=\"item\" hint-placeholder-count=\"3\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n<input type=\"text\" aria-label=\"Назва витрати\" placeholder=\"Витрата {{item.num}}\" value=\"{{item.name}}\" sc-camel-on-change=\"{{item.onName}}\" style=\"flex: 1 1 180px; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 14px; background: #FFFFFF; color: #1E1640; font-family: inherit; font-size: 18px\">\n<input type=\"number\" min=\"0\" step=\"500\" inputmode=\"numeric\" aria-label=\"Сума витрати, грн\" placeholder=\"0\" value=\"{{item.amount}}\" sc-camel-on-change=\"{{item.onAmount}}\" style=\"flex: 0 1 140px; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 14px; background: #FFFFFF; color: #1E1640; font-family: inherit; font-size: 20px; font-weight: 700\">\n<button type=\"button\" aria-label=\"Видалити витрату\" sc-camel-on-click=\"{{item.onRemove}}\" style=\"flex: 0 0 44px; width: 44px; height: 44px; padding: 0; border: none; border-radius: 12px; background: #F3D9B5; color: #1E1640; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<button type=\"button\" sc-camel-on-click=\"{{addExpense}}\" style=\"align-self: flex-start; min-height: 48px; padding: 0 22px; border: none; border-radius: 999px; background: #7B5CE8; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer\">+ Додати витрату<\u002Fbutton>\n<span style=\"font-size: 14px; color: #5B5470\">Джоб-борди, сервіси, реклама, бухгалтер, офіс<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n\n<div style=\"background: #FFD426; color: #1E1640; border-radius: 28px; padding: 32px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; text-align: center\">\n<span style=\"font-size: 17px; font-weight: 700\">Твій прибуток на місяць<\u002Fspan>\n<span style=\"font-size: 46px; line-height: 1.1; font-weight: 700\">{{profitM}} грн<\u002Fspan>\n<span style=\"font-size: 17px\">За рік: <b>{{profitY}} грн<\u002Fb><\u002Fspan>\n<sc-if value=\"{{isLoss}}\" hint-placeholder-val=\"{{false}}\">\n<span style=\"font-size: 15px; font-weight: 700; margin-top: 4px\">Поки витрати більші за дохід<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"background: #FFFFFF; border: 3px solid #FDECD3; color: #1E1640; border-radius: 28px; padding: 26px 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; font-size: 16px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px\"><span>Виручка ({{vacCount}} {{vacWord}})<\u002Fspan><b style=\"white-space: nowrap\">{{revF}} грн<\u002Fb><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 12px\"><span>Єдиний податок {{epRate}}%<\u002Fspan><span style=\"white-space: nowrap\">−{{epF}} грн<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 12px\"><span>Військовий збір {{vzRate}}%<\u002Fspan><span style=\"white-space: nowrap\">−{{vzF}} грн<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 12px\"><span>ЄСВ<\u002Fspan><span style=\"white-space: nowrap\">−{{esvF}} грн<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{teamRows}}\" as=\"row\" hint-placeholder-count=\"1\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px\"><span style=\"overflow-wrap: anywhere\">{{row.label}}<span style=\"display: block; font-size: 13px; color: #5B5470\">ставка {{row.salaryF}} + бонус {{row.bonusF}}<\u002Fspan><\u002Fspan><span style=\"white-space: nowrap\">−{{row.totalF}} грн<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<sc-for list=\"{{expenseRows}}\" as=\"row\" hint-placeholder-count=\"3\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px\"><span style=\"overflow-wrap: anywhere\">{{row.label}}<\u002Fspan><span style=\"white-space: nowrap\">−{{row.amountF}} грн<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"height: 2px; background: #1E1640; opacity: 0.2\"><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 12px; font-size: 19px\"><b>Прибуток<\u002Fb><b style=\"white-space: nowrap\">{{profitM}} грн<\u002Fb><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border: 3px solid #7B5CE8; border-radius: 28px; padding: 22px 24px; box-sizing: border-box; font-size: 17px; line-height: 1.5; text-align: center\">\nЩоб вийти в нуль, треба закривати вакансій приблизно на <b style=\"color: #5A3FD0; white-space: nowrap\">{{beF}} грн<\u002Fb> на місяць\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #7B5CE8; color: #FFFFFF; border-radius: 28px; padding: 36px 32px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center\">\n<h2 style=\"margin: 0; font-size: 28px; line-height: 1.3; font-weight: 700; max-width: 720px\">Хочеш, щоб ці цифри стали твоїми?<\u002Fh2>\n<a href=\"#\" style=\"background: #FFD426; color: #1E1640; font-weight: 700; font-size: 18px; text-decoration: none; padding: 16px 28px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Приходь на курс «Своя рекрутингова агенція»<\u002Fa>\n<\u002Fdiv>\n\n<p style=\"margin: 0; font-size: 14px; line-height: 1.5; text-align: center; color: #5B5470\">Розрахунок орієнтовний: без урахування гарантійних замін і затримок оплати від клієнтів.<\u002Fp>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:2300}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      nextId: 8,\n      vacancies: [\n        { id: 1, name: 'Менеджер з продажу', fee: '30000', who: 'r7' },\n        { id: 2, name: 'Бухгалтер', fee: '25000', who: 'r7' },\n        { id: 3, name: 'Java-розробник', fee: '70000', who: 'me' }\n      ],\n      recruiters: [\n        { id: 7, name: 'Рекрутер 1', salary: '15000', bonus: '10' }\n      ],\n      expenses: [\n        { id: 4, name: 'Джоб-борди', amount: '6000' },\n        { id: 5, name: 'Сервіси (ATS, CRM)', amount: '3000' },\n        { id: 6, name: 'Бухгалтер', amount: '3000' }\n      ],\n      ep: '5', vz: '1', esv: '1902'\n    };\n  }\n  updateItem(list, id, key, val) {\n    this.setState(function (st) {\n      var o = {};\n      o[list] = st[list].map(function (x) {\n        if (x.id !== id) return x;\n        var c = Object.assign({}, x); c[key] = val; return c;\n      });\n      return o;\n    });\n  }\n  removeItem(list, id) {\n    this.setState(function (st) {\n      var o = {};\n      o[list] = st[list].filter(function (x) { return x.id !== id; });\n      if (list === 'recruiters') {\n        o.vacancies = st.vacancies.map(function (v) {\n          return v.who === 'r' + id ? Object.assign({}, v, { who: 'me' }) : v;\n        });\n      }\n      return o;\n    });\n  }\n  addItem(list, blank) {\n    this.setState(function (st) {\n      var o = { nextId: st.nextId + 1 };\n      o[list] = st[list].concat([Object.assign({ id: st.nextId }, blank)]);\n      return o;\n    });\n  }\n  renderVals() {\n    var self = this;\n    var s = this.state;\n    var num = function (v) { var x = parseFloat(String(v).replace(',', '.')); return isFinite(x) && x > 0 ? x : 0; };\n    var fmt = function (x) { return Math.round(Math.abs(x)).toLocaleString('uk-UA'); };\n    var setter = function (key) { return function (e) { var o = {}; o[key] = e.target.value; self.setState(o); }; };\n    var epRate = num(s.ep), vzRate = num(s.vz), esv = num(s.esv);\n\n    var recLabel = function (r, i) { return (r.name && r.name.trim()) ? r.name : 'Рекрутер ' + (i + 1); };\n    var whoOptions = [{ value: 'me', label: 'Я' }].concat(s.recruiters.map(function (r, i) {\n      return { value: 'r' + r.id, label: recLabel(r, i) };\n    }));\n\n    var rev = 0;\n    var closedBy = {};\n    var vacancies = s.vacancies.map(function (v, i) {\n      var f = num(v.fee);\n      rev += f;\n      closedBy[v.who] = (closedBy[v.who] || 0) + f;\n      return {\n        id: v.id, num: i + 1, name: v.name, fee: v.fee, who: v.who,\n        onName: function (e) { self.updateItem('vacancies', v.id, 'name', e.target.value); },\n        onFee: function (e) { self.updateItem('vacancies', v.id, 'fee', e.target.value); },\n        onWho: function (e) { self.updateItem('vacancies', v.id, 'who', e.target.value); },\n        onRemove: function () { self.removeItem('vacancies', v.id); }\n      };\n    });\n\n    var salaries = 0, bonuses = 0;\n    var recruiters = s.recruiters.map(function (r, i) {\n      return {\n        id: r.id, num: i + 1, name: r.name, salary: r.salary, bonus: r.bonus,\n        onName: function (e) { self.updateItem('recruiters', r.id, 'name', e.target.value); },\n        onSalary: function (e) { self.updateItem('recruiters', r.id, 'salary', e.target.value); },\n        onBonus: function (e) { self.updateItem('recruiters', r.id, 'bonus', e.target.value); },\n        onRemove: function () { self.removeItem('recruiters', r.id); }\n      };\n    });\n    var teamRows = s.recruiters.map(function (r, i) {\n      var sal = num(r.salary);\n      var bon = (closedBy['r' + r.id] || 0) * num(r.bonus) / 100;\n      salaries += sal; bonuses += bon;\n      return { label: recLabel(r, i), salaryF: fmt(sal), bonusF: fmt(bon), totalF: fmt(sal + bon) };\n    });\n\n    var exp = 0;\n    var expenses = s.expenses.map(function (x, i) {\n      exp += num(x.amount);\n      return {\n        id: x.id, num: i + 1, name: x.name, amount: x.amount,\n        onName: function (e) { self.updateItem('expenses', x.id, 'name', e.target.value); },\n        onAmount: function (e) { self.updateItem('expenses', x.id, 'amount', e.target.value); },\n        onRemove: function () { self.removeItem('expenses', x.id); }\n      };\n    });\n    var expenseRows = s.expenses.map(function (x, i) {\n      return { label: (x.name && x.name.trim()) ? x.name : 'Витрата ' + (i + 1), amountF: fmt(num(x.amount)) };\n    });\n\n    var epTax = rev * epRate / 100;\n    var vzTax = rev * vzRate / 100;\n    var profit = rev - epTax - vzTax - esv - salaries - bonuses - exp;\n    var bonusShare = rev > 0 ? bonuses / rev : 0;\n    var margin = 1 - epRate / 100 - vzRate / 100 - bonusShare;\n    var be = margin > 0 ? (salaries + exp + esv) / margin : 0;\n    var n = s.vacancies.length, m10 = n % 10, m100 = n % 100;\n    var vacWord = (m10 === 1 && m100 !== 11) ? 'вакансія' : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? 'вакансії' : 'вакансій';\n    var sign = profit < 0 ? '−' : '';\n\n    return {\n      vacancies: vacancies,\n      recruiters: recruiters,\n      expenses: expenses,\n      whoOptions: whoOptions,\n      teamRows: teamRows,\n      expenseRows: expenseRows,\n      addVacancy: function () { self.addItem('vacancies', { name: '', fee: '', who: 'me' }); },\n      addRecruiter: function () { self.addItem('recruiters', { name: '', salary: '', bonus: '' }); },\n      addExpense: function () { self.addItem('expenses', { name: '', amount: '' }); },\n      ep: s.ep, vz: s.vz, esv: s.esv,\n      onEp: setter('ep'), onVz: setter('vz'), onEsv: setter('esv'),\n      epRate: epRate, vzRate: vzRate,\n      vacCount: n, vacWord: vacWord,\n      revF: fmt(rev), epF: fmt(epTax), vzF: fmt(vzTax), esvF: fmt(esv),\n      profitM: sign + fmt(profit), profitY: sign + fmt(profit * 12),\n      isLoss: profit < 0,\n      beF: fmt(be)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
